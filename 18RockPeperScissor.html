<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper scissor</title>
    <link rel="stylesheet" href="18RockPeperScissor.css">
</head>

<body>
        <h1>ROCK PAPER SCISSOR</h1>

    <div>
        <p>Enter your choice ...</p>
        <div id="myBox">
            
             
             <button  class="tag" onclick="playGame('scissor')">Scissor ✂️</button>
             <button  class="tag" onclick="playGame('paper')">Paper🖐️</button>
             <button  class="tag" onclick="playGame('stone')">Stone🤜</button>
        </div>

        <p id="playerDisplay">Player Choice :</p>

        <div id="myBox2">
            <p  id="computerDisplay" >Computer Choice :</p>
        </div>

        <p id="resultDisplay">Result :</p>
    </div>

    <div id="myBox3">
        Player win count : <span id="pWin">0</span> <br>
        Computer win count : <span id="cWin">0</span>
    </div>
<script src="18RockPeperScissor.js"></script>
</body>
</html>

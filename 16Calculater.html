<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="16Calculator.css">
</head>
<body>
    <div id="calculator">
    <input type="text" id="display" readonly>
    <div id="btns">
        <button onclick="getBtn ('9') ">9</button>
        <button onclick="getBtn ('8') ">8</button>
        <button onclick="getBtn ('7') ">7</button>
        <button onclick="getBtn ('+') " class="operator">+</button>
        <button onclick="getBtn ('6') ">6</button>
        <button onclick="getBtn ('5') ">5</button>
        <button onclick="getBtn ('4') ">4</button>
        <button onclick="getBtn ('-') " class="operator">-</button>
        <button onclick="getBtn ('3') ">3</button>
        <button onclick="getBtn ('2') ">2</button>
        <button onclick="getBtn ('1') ">1</button>
        <button onclick="getBtn ('*') " class="operator">*</button>
        <button onclick="getBtn ('.') ">.</button>
        <button onclick="getBtn ('0') ">0</button>

        <button onclick="getBtn ('=') " >=</button>
                <button onclick="getBtn ('/') " class="operator">/</button>
        <button onclick="getBtn ('C') ">C</button>
    </div>
    </div>

    <script src="16Calculator.js"></script>
